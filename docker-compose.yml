services:
  fixtrace:
    build: .
    ports:
      - "8080:8080"
    environment:
      FIXTRACE_ALLOW_LOCAL_EXECUTION: "0"
      FIXTRACE_ALLOW_LOCAL_SOURCES: "0"
      FIXTRACE_WORK_ROOT: /tmp/fixtrace-workspaces
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
